name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        # internal/desktop is excluded: vet flags the deliberate uintptr<->pointer
        # conversions required by the Win32/COM drag-and-drop callbacks.
        shell: bash
        run: go vet $(go list ./... | grep -v /internal/desktop)
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        shell: bash
        run: |
          V="-X lantransfer/internal/version.Version=2.1.0-ci.${GITHUB_RUN_NUMBER}"
          go build -trimpath -ldflags="-s -w $V -H windowsgui" -o LANTransfer.exe .
          go build -trimpath -ldflags="-s -w $V" -o LANTransferCLI.exe .
          ./LANTransferCLI.exe version
      - uses: actions/upload-artifact@v4
        with:
          name: lantransfer-windows
          path: |
            LANTransfer.exe
            LANTransferCLI.exe

  linux:
    # The core (protocol, security, CLI) is portable; the window is Windows-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -count=1 ./internal/fsafe/ ./internal/security/ ./internal/service/ ./internal/cli/ ./internal/discovery/ ./internal/networksetup/ ./internal/i18n/

  readme:
    # README.md and the 29 translations in README/ must stay in sync
    # (structure, commands, technical literals, anchors, links).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_readmes.py

  i18n:
    # locales/ui.<code>.json: same keys, placeholders, plural forms and no
    # leftover Polish in all 30 languages; the page runtime (i18n.js) is
    # tested with the real catalogs in Node.js (same Intl/CLDR as WebView2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/check_i18n.py
      - run: node tools/test_i18n.js
