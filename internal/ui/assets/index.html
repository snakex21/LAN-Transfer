<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAN Transfer</title>
<style>/*__STYLE__*/</style>
</head>
<!-- Texts come from locales/ui.<code>.json: data-i18n="key" sets the text,
     data-i18n-title / -placeholder / -aria-label set attributes. -->
<body class="i18n-pending">
<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">⇄</span>
    <div>
      <h1>LAN Transfer</h1>
      <div class="subtitle" id="me" data-i18n="app.starting"></div>
    </div>
  </div>
  <div class="topbar-end">
    <section class="receive-box" aria-labelledby="receiveTitle">
      <div class="receive-main">
        <div class="label" id="receiveTitle" data-i18n="receive.title"></div>
        <div class="code" id="pairingCode" dir="ltr" aria-live="polite">––– –––</div>
        <div class="muted small"><span data-i18n="receive.fingerprint"></span> <b id="fingerprint" dir="ltr">—</b></div>
      </div>
      <div class="receive-actions">
        <button class="btn ghost small" id="newCode" data-i18n="receive.newCode" data-i18n-title="receive.newCodeHint"></button>
        <button class="btn ghost small" id="openReceive" data-i18n="receive.openFolder" data-i18n-title="receive.openFolderHint"></button>
      </div>
    </section>
    <button class="icon-btn settings-btn" id="openSettings" data-i18n-title="settings.title" data-i18n-aria-label="settings.title">⚙</button>
  </div>
</header>

<div id="firewallBanner" class="banner hidden" role="status">
  <div><b data-i18n="firewall.title"></b>
    <span class="muted" data-i18n="firewall.body"></span></div>
  <div class="banner-actions">
    <button class="btn small" id="firewallUpdate" data-i18n="firewall.update"></button>
    <button class="btn ghost small" id="firewallLater" data-i18n="firewall.later"></button>
  </div>
</div>

<main class="layout">
  <section class="card devices-card" aria-labelledby="devicesTitle">
    <div class="section-head">
      <div>
        <h2 id="devicesTitle"><span class="step">1</span><span data-i18n="devices.title"></span></h2>
        <div class="muted" data-i18n="devices.subtitle"></div>
      </div>
      <button class="btn secondary small" id="refresh" data-i18n="common.refresh"></button>
    </div>
    <div id="devices" class="devices"><div class="empty" data-i18n="devices.searching"></div></div>
    <details class="manual">
      <summary data-i18n="devices.manual"></summary>
      <form id="manualForm" class="manual-form">
        <input id="manualAddress" dir="auto" data-i18n-placeholder="devices.manualPlaceholder" data-i18n-aria-label="devices.manualLabel" autocomplete="off" spellcheck="false">
        <button class="btn secondary small" type="submit" id="manualConnect" data-i18n="devices.connect"></button>
      </form>
    </details>
  </section>

  <section class="card" aria-labelledby="pickTitle">
    <h2 id="pickTitle"><span class="step">2</span><span data-i18n="pick.title"></span></h2>
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon" aria-hidden="true">⬇</div>
      <div class="drop-note"><b data-i18n="pick.dropHere"></b><br><span class="muted" data-i18n="pick.or"></span></div>
      <div class="picker-actions">
        <button class="btn" id="pickFiles" data-i18n="pick.files"></button>
        <button class="btn secondary" id="pickFolder" data-i18n="pick.folder"></button>
      </div>
      <form id="pathForm" class="path-form">
        <input id="pathInput" dir="auto" data-i18n-placeholder="pick.pathPlaceholder" data-i18n-aria-label="pick.pathLabel" autocomplete="off" spellcheck="false">
        <button class="btn ghost small" type="submit" id="pathAdd" data-i18n="pick.add"></button>
      </form>
    </div>
    <div class="selection-head hidden" id="selectionHead">
      <span id="selectionCount"></span>
      <button class="link-btn" id="clearSelection" data-i18n="pick.clear"></button>
    </div>
    <div id="selection" class="selection" role="list"></div>
    <div id="previewPanel" class="preview-panel hidden">
      <div class="preview-head">
        <div class="preview-title-wrap"><b id="previewTitle"></b><span id="previewMeta"></span></div>
        <button class="icon-btn" id="closePreview" data-i18n-title="preview.close" data-i18n-aria-label="preview.close">×</button>
      </div>
      <div id="previewBody" class="preview-body"></div>
    </div>
  </section>

  <section class="card" aria-labelledby="destTitle">
    <h2 id="destTitle"><span class="step">3</span><span data-i18n="dest.title"></span></h2>
    <div id="remoteHint" class="muted" data-i18n="dest.pairFirst"></div>
    <div id="destBox" class="hidden">
      <label class="radio"><input type="radio" name="destMode" value="default" checked><span id="destDefaultLabel"></span></label>
      <label class="radio"><input type="radio" name="destMode" value="custom"><span data-i18n="dest.custom"></span></label>
      <div id="remoteBrowser" class="remote-browser hidden">
        <div class="pathbar">
          <button class="icon-btn" id="remoteUp" data-i18n-title="dest.up" data-i18n-aria-label="dest.up">↑</button>
          <div class="remote-path ltr-text" id="remotePath"></div>
          <button class="icon-btn" id="remoteRefresh" data-i18n-title="common.refresh" data-i18n-aria-label="common.refresh">⟳</button>
        </div>
        <div id="remoteEntries" class="folder-list"></div>
      </div>
    </div>
    <div class="send-row">
      <div class="muted" id="summary"></div>
      <button id="send" class="btn send-btn" disabled data-i18n="send.button"></button>
    </div>
  </section>

  <section class="card wide" aria-labelledby="transfersTitle">
    <div class="section-head">
      <h2 id="transfersTitle" data-i18n="transfers.title"></h2>
      <button class="link-btn hidden" id="clearFinished" data-i18n="transfers.clearFinished"></button>
    </div>
    <div id="transfers" class="transfers" aria-live="polite"></div>
  </section>

  <section class="card wide" aria-labelledby="historyTitle">
    <div class="section-head">
      <h2 id="historyTitle" data-i18n="history.title"></h2>
      <button class="link-btn" id="clearHistory" data-i18n="history.clear"></button>
    </div>
    <div id="history" class="history"></div>
  </section>
</main>

<dialog id="pairDialog" aria-labelledby="pairTitle">
  <form method="dialog" id="pairForm">
    <h2 id="pairTitle"></h2>
    <p class="muted" id="pairIntro"></p>
    <input id="pairCode" dir="ltr" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000000" data-i18n-aria-label="pair.codeLabel">
    <div class="form-error" id="pairError" role="alert"></div>
    <div class="dialog-actions">
      <button class="btn ghost" value="cancel" type="button" id="pairCancel" data-i18n="common.cancel"></button>
      <button class="btn" id="pairSubmit" type="submit" data-i18n="pair.submit"></button>
    </div>
  </form>
</dialog>

<dialog id="settingsDialog" aria-labelledby="settingsTitle">
  <form method="dialog" id="settingsForm">
    <h2 id="settingsTitle" data-i18n="settings.title"></h2>
    <label class="field" for="languageSelect" data-i18n="settings.language"></label>
    <select id="languageSelect"></select>
    <p class="muted small field-hint" id="languageHint"></p>
    <div class="dialog-actions">
      <button class="btn" type="submit" id="settingsClose" data-i18n="common.close"></button>
    </div>
  </form>
</dialog>

<footer class="footer">
  <span>LAN Transfer <b id="appVersion" dir="ltr">—</b> · <span id="appProtocol"></span></span>
  <span class="muted">MIT · <span id="repoLink" dir="ltr">github.com/snakex21/LAN-Transfer</span></span>
</footer>

<div id="toasts" class="toasts" aria-live="assertive"></div>
<script>//__I18N__</script>
<script>//__SCRIPT__</script>
</body>
</html>
